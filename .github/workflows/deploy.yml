name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  test-frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: /api/v1
        run: npm run build

  test-backend:
    name: Backend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Check imports
        working-directory: backend
        run: python -c "from app.main import app; print('Backend imports OK')"

  deploy:
    name: Deploy to Production
    needs: [test-frontend, test-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/velmora-kids

            echo "=== Pulling latest code ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Building & deploying ==="
            docker compose -f docker-compose.prod.yml --env-file .env.prod build --parallel
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

            echo "=== Running migrations ==="
            sleep 8
            docker compose -f docker-compose.prod.yml exec -T backend sh -c "alembic upgrade head" || true

            echo "=== Cleanup ==="
            docker image prune -f

            echo "=== Health check ==="
            sleep 5
            HTTP_CODE=$(curl -sk -o /dev/null -w "%{http_code}" https://velmora-kids.uz/)
            echo "HTTP Status: $HTTP_CODE"
            if [ "$HTTP_CODE" != "200" ]; then
              echo "WARNING: Site returned $HTTP_CODE"
              docker compose -f docker-compose.prod.yml logs --tail=20 frontend
              docker compose -f docker-compose.prod.yml logs --tail=20 backend
              exit 1
            fi
            echo "Deploy successful!"
