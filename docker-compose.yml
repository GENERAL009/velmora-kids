version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: velmora_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-velmora_kids}
      POSTGRES_USER: ${POSTGRES_USER:-velmora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-velmora_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-velmora}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: velmora_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: velmora_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-velmora}:${POSTGRES_PASSWORD:-velmora_secret}@postgres:5432/${POSTGRES_DB:-velmora_kids}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-velmora}:${POSTGRES_PASSWORD:-velmora_secret}@postgres:5432/${POSTGRES_DB:-velmora_kids}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-super-secret-key-change-in-production}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:80","http://localhost","https://corsage-spring-hybrid.ngrok-free.dev"]'
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-8821316184:AAHdJmz0HTvQhjeiDRcw93Q3wchcyxHK8UA}"
      TELEGRAM_GROUP_ID: "${TELEGRAM_GROUP_ID:--1003937642808}"
      TELEGRAM_ADMIN_IDS: "${TELEGRAM_ADMIN_IDS:-[1566454370,1519994286,8257343094]}"
      BACKEND_BASE_URL: "${BACKEND_BASE_URL:-}"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: velmora_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-velmora}:${POSTGRES_PASSWORD:-velmora_secret}@postgres:5432/${POSTGRES_DB:-velmora_kids}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-velmora}:${POSTGRES_PASSWORD:-velmora_secret}@postgres:5432/${POSTGRES_DB:-velmora_kids}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-super-secret-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.worker worker --loglevel=info

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-velmora}:${POSTGRES_PASSWORD:-velmora_secret}@postgres:5432/${POSTGRES_DB:-velmora_kids}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-velmora}:${POSTGRES_PASSWORD:-velmora_secret}@postgres:5432/${POSTGRES_DB:-velmora_kids}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: alembic upgrade head
    profiles:
      - tools

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-velmora}:${POSTGRES_PASSWORD:-velmora_secret}@postgres:5432/${POSTGRES_DB:-velmora_kids}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-velmora}:${POSTGRES_PASSWORD:-velmora_secret}@postgres:5432/${POSTGRES_DB:-velmora_kids}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python seed.py
    profiles:
      - tools

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: velmora_frontend
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_PAYMENT_CARD_NUMBER: ${NEXT_PUBLIC_PAYMENT_CARD_NUMBER:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  nginx:
    image: nginx:alpine
    container_name: velmora_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
